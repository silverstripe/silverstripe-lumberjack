name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Every Thursday at 12:00pm UTC
  schedule:
    - cron: '0 12 * * 4'

jobs:
  ci:
    name: CI
    # Only run cron on the silverstripe account
    if: (github.event_name == 'schedule' && github.repository_owner == 'silverstripe') || (github.event_name != 'schedule')
    uses: creative-commoners/gha-ci/.github/workflows/ci.yml@pulls/1.14/NO-MERGE-test-only
